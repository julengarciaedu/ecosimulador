<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🌿 EcoSimulator - Nuevo Usuario</title>
        <link rel="stylesheet" href="/ecosimulator/css/ecostyles.css">
        <style>
            .edit-container {
                max-width: 600px;
                margin: 0 auto;
                padding: var(--space-lg);
            }

            .form-group {
                margin-bottom: var(--space-md);
            }

            .form-group label {
                display: block;
                font-weight: 600;
                color: var(--color-forest-dark);
                margin-bottom: var(--space-xs);
            }

            .form-group input, .form-group select {
                width: 100%;
                padding: var(--space-sm) var(--space-md);
                border: 2px solid rgba(45, 106, 79, 0.15);
                border-radius: var(--radius-md);
                font-size: 1rem;
                transition: var(--transition-smooth);
            }

            .form-group input:focus, .form-group select:focus {
                border-color: var(--color-secondary);
                outline: none;
                box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
            }

            .checkbox-group input[type="checkbox"] {
                width: 1.5rem;
                height: 1.5rem;
                cursor: pointer;
            }

            .btn-group {
                display: flex;
                gap: var(--space-md);
                margin-top: var(--space-lg);
            }

            .btn-group button {
                flex: 1;
                padding: var(--space-md);
            }

            .btn-secondary {
                background: var(--color-earth-light);
                color: var(--text-primary);
            }

            .btn-secondary:hover {
                background: var(--color-earth);
            }
        </style>
    </head>
    <body>
        <header>
            <h1>➕ Nuevo Usuario</h1>
            <p style="color: var(--text-secondary);">Da de alta un nuevo usuario en el sistema</p>
        </header>

        <nav>
            <ul>
                <li><a href="/ecosimulator/admin/dashboard">⚙️ Administración</a></li>
                <li><a href="/ecosimulator/admin/usuarios">👥 Usuarios</a></li>
                <li><a href="/ecosimulator/admin/usuario/nuevo" style="font-weight: 700; color: var(--color-primary);">➕ Nuevo</a></li>
            </ul>
            <div style="display: flex; gap: var(--space-md); align-items: center;">
                <span style="color: var(--text-secondary);">👤 {{username}}</span>
                <a href="/ecosimulator/logout" style="color: var(--text-secondary);">🚪 Salir</a>
            </div>
        </nav>

        <main style="margin-top: var(--space-lg);">
            <div class="edit-container">
                <div class="card">
                    <form action="/ecosimulator/admin/usuario/crear" method="POST">
                        <div class="form-group">
                            <label for="username">👤 Nombre de Usuario</label>
                            <input type="text" id="username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="email">📧 Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">🔑 Contraseña</label>
                            <input type="password" id="password" name="password" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="rol">🎯 Rol</label>
                            <select id="rol" name="rol">
                                <option value="ecousuario">Eco Usuario</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="avatar">🖼️ Avatar</label>
                            <input type="text" id="avatar" name="avatar" placeholder="avatares_default.png">
                        </div>

                        <div class="form-group">
                            <label for="bio">📝 Biografía</label>
                            <textarea id="bio" name="bio" rows="4"
                                      style="width:100%; padding: var(--space-sm) var(--space-md); border: 2px solid rgba(45, 106, 79, 0.15); border-radius: var(--radius-md); font-family: var(--font-primary);"></textarea>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="activo" name="activo" checked>
                            <label for="activo" style="margin: 0;">Usuario Activo</label>
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn-primary">💾 Crear Usuario</button>
                            <a href="/ecosimulator/admin/usuarios" class="btn-secondary"
                               style="text-align: center; text-decoration: none; padding: var(--space-md); border-radius: var(--radius-lg);">
                                ↩️ Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer>
            <p>🌿 EcoSimulator v1.0 - Nuevo Usuario</p>
        </footer>
    </body>
</html>
