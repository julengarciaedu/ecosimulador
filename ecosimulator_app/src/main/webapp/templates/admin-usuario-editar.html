<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🌿 EcoSimulator - Editar Usuario</title>
        <link rel="stylesheet" href="/ecosimulator/css/ecostyles.css">
        <style>
            .edit-container {
                max-width: 600px;
                margin: 0 auto;
                padding: var(--space-lg);
            }

            .form-group {
                margin-bottom: var(--space-md);
            }

            .form-group label {
                display: block;
                font-weight: 600;
                color: var(--color-forest-dark);
                margin-bottom: var(--space-xs);
            }

            .form-group input, .form-group select {
                width: 100%;
                padding: var(--space-sm) var(--space-md);
                border: 2px solid rgba(45, 106, 79, 0.15);
                border-radius: var(--radius-md);
                font-size: 1rem;
                transition: var(--transition-smooth);
            }

            .form-group input:focus, .form-group select:focus {
                border-color: var(--color-secondary);
                outline: none;
                box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: var(--space-sm);
            }
            
            .checkbox-group input[type="checkbox"] {
                width: 1.5rem;
                height: 1.5rem;
                cursor: pointer;
            }

            /*.checkbox-group {
                display: inline-flex; 
                margin: 0;
                padding: 0;
                align-items: center; 
                gap: 8px; 
            }*/

            .btn-group {
                display: flex;
                gap: var(--space-md);
                margin-top: var(--space-lg);
            }

            .btn-group button {
                flex: 1;
                padding: var(--space-md);
            }

            .btn-danger {
                background: #e74c3c;
            }

            .btn-danger:hover {
                background: #c0392b;
            }

            .btn-secondary {
                background: var(--color-earth-light);
                color: var(--text-primary);
            }

            .btn-secondary:hover {
                background: var(--color-earth);
            }

            .avatar-preview {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                border: 3px solid var(--color-primary);
                object-fit: cover;
                display: block;
                margin: var(--space-sm) 0;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>✏️ Editar Usuario</h1>
            <p style="color: var(--text-secondary);">Modifica los datos del usuario</p>
        </header>

        <nav>
            <ul>
                <li><a href="/ecosimulator/admin/dashboard">⚙️ Administración</a></li>
                <li><a href="/ecosimulator/admin/usuarios">👥 Usuarios</a></li>
                <li><a href="/ecosimulator/admin/usuarios/editar/{{usuario.id}}" style="font-weight: 700; color: var(--color-primary);">✏️ Editar</a></li>
            </ul>
            <div style="display: flex; gap: var(--space-md); align-items: center;">
                <span style="color: var(--text-secondary);">👤 {{username}}</span>
                <a href="/ecosimulator/logout" style="color: var(--text-secondary);">🚪 Salir</a>
            </div>
        </nav>

        <main style="margin-top: var(--space-lg);">
            <div class="edit-container">
                <div class="card">
                    <form action="/ecosimulator/admin/usuario/actualizar" method="POST">
                        <input type="hidden" name="id" value="{{usuario.id}}">

                        <div class="form-group">
                            <label for="username">👤 Nombre de Usuario</label>
                            <input type="text" id="username" name="username" 
                                   value="{{usuario.username}}" required>
                        </div>

                        <div class="form-group">
                            <label for="email">📧 Email</label>
                            <input type="email" id="email" name="email" 
                                   value="{{usuario.email}}" required>
                        </div>

                        <div class="form-group">
                            <label for="rol">🎯 Rol</label>
                            <select id="rol" name="rol">
                                <option value="admin" {{#usuario.isAdmin}}selected{{/usuario.isAdmin}}>Administrador</option>
                                <option value="ecousuario" {{^usuario.isAdmin}}selected{{/usuario.isAdmin}}>Eco Usuario</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="avatar">🖼️ Avatar</label>
                            <div style="display: flex; align-items: center; gap: var(--space-md);">
                                <img src="/ecosimulator/assets/avatars/{{usuario.avatar}}" 
                                     alt="Avatar" class="avatar-preview" 
                                     onerror="this.src='/ecosimulator/assets/avatars/avatares_default.png'">
                                <input type="text" id="avatar" name="avatar" 
                                       value="{{usuario.avatar}}" 
                                       placeholder="nombre_del_avatar.png">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="bio">📝 Biografía</label>
                            <textarea id="bio" name="bio" rows="4" 
                                      style="width:100%; padding: var(--space-sm) var(--space-md); border: 2px solid rgba(45, 106, 79, 0.15); border-radius: var(--radius-md); font-family: var(--font-primary);">{{usuario.bio}}</textarea>
                        </div>

                        <div class="form-group checkbox-group">
                        <!--div-->
                            <input type="checkbox" id="activo" name="activo" {{#usuario.activo}}checked{{/usuario.activo}}>
                                   <label for="activo" style="margin: 0;">Usuario Activo</label>
                        </div>

                        <div style="background: #f8f9fa; padding: var(--space-md); border-radius: var(--radius-md); margin: var(--space-md) 0;">
                            <p style="font-size: 0.9rem; color: var(--text-secondary);">
                                📅 Registrado: {{usuario.creadoEn}}<br>
                                🔑 Último login: {{usuario.ultimoLogin}}
                            </p>
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn-primary">💾 Guardar Cambios</button>
                            <a href="/ecosimulator/admin/usuarios" class="btn-secondary" 
                               style="text-align: center; text-decoration: none; padding: var(--space-md); border-radius: var(--radius-lg);">
                                ↩️ Cancelar
                            </a>
                        </div>
                    </form>

                    <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid rgba(45, 106, 79, 0.1);">
                        <form action="/ecosimulator/admin/usuario/eliminar" method="POST" 
                              onsubmit="return confirm('⚠️ ¿Estás seguro de que quieres eliminar este usuario? Esta acción no se puede deshacer.');">
                            <input type="hidden" name="id" value="{{usuario.id}}">
                            <button type="submit" class="btn-danger" style="width: 100%;">🗑️ Eliminar Usuario</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>🌿 EcoSimulator v1.0 - Editar Usuario</p>
        </footer>
    </body>
</html>
