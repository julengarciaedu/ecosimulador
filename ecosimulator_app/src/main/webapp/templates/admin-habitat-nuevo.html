<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 EcoSimulator - Nuevo Hábitat</title>
    <link rel="stylesheet" href="/ecosimulator/css/ecostyles.css">
    <style>
        .edit-container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-lg);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
        }

        .form-full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--color-forest-dark);
            margin-bottom: var(--space-xs);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            border: 2px solid rgba(45, 106, 79, 0.15);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: var(--transition-smooth);
            font-family: var(--font-primary);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--color-secondary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
        }

        .btn-group {
            display: flex;
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }

        .btn-group button {
            flex: 1;
            padding: var(--space-md);
        }

        .btn-secondary {
            background: var(--color-earth-light);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--color-earth);
        }
    </style>
</head>
<body>
    <header>
        <h1>➕ Nuevo Hábitat</h1>
        <p style="color: var(--text-secondary);">Da de alta un nuevo hábitat en el sistema</p>
    </header>

    <nav>
        <ul>
            <li><a href="/ecosimulator/admin/dashboard">⚙️ Administración</a></li>
            <li><a href="/ecosimulator/admin/habitats">🏞️ Hábitats</a></li>
            <li><a href="/ecosimulator/admin/habitat/nuevo" style="font-weight: 700; color: var(--color-primary);">➕ Nuevo</a></li>
        </ul>
        <div style="display: flex; gap: var(--space-md); align-items: center;">
            <span style="color: var(--text-secondary);">👤 {{username}}</span>
            <a href="/ecosimulator/logout" style="color: var(--text-secondary);">🚪 Salir</a>
        </div>
    </nav>

    <main style="margin-top: var(--space-lg);">
        <div class="edit-container">
            <div class="card">
                <form action="/ecosimulator/admin/habitat/crear" method="POST">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombre">🏷️ Nombre</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form-group">
                            <label for="tipoBioma">🌍 Tipo de Bioma</label>
                            <select id="tipoBioma" name="tipoBioma">
                                <option value="bosque_tropical">Bosque Tropical</option>
                                <option value="bosque_templado">Bosque Templado</option>
                                <option value="bosque_boreal">Bosque Boreal</option>
                                <option value="pradera_tropical">Pradera Tropical</option>
                                <option value="pradera_templada">Pradera Templada</option>
                                <option value="desierto_calido">Desierto Cálido</option>
                                <option value="desierto_frio">Desierto Frío</option>
                                <option value="tundra_artica">Tundra Ártica</option>
                                <option value="sabana">Sabana</option>
                                <option value="humedal">Humedal</option>
                                <option value="manglar">Manglar</option>
                                <option value="marino_costero">Marino Costero</option>
                                <option value="arrecife_coral">Arrecife de Coral</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="pais">🌎 País</label>
                            <input type="text" id="pais" name="pais">
                        </div>

                        <div class="form-group">
                            <label for="region">📍 Región</label>
                            <input type="text" id="region" name="region">
                        </div>

                        <div class="form-group">
                            <label for="latitud">🗺️ Latitud</label>
                            <input type="number" id="latitud" name="latitud" step="0.00000001">
                        </div>

                        <div class="form-group">
                            <label for="longitud">🗺️ Longitud</label>
                            <input type="number" id="longitud" name="longitud" step="0.00000001">
                        </div>

                        <div class="form-group">
                            <label for="altitudMin">⛰️ Altitud Mínima (m)</label>
                            <input type="number" id="altitudMin" name="altitudMin" step="1">
                        </div>

                        <div class="form-group">
                            <label for="altitudMax">⛰️ Altitud Máxima (m)</label>
                            <input type="number" id="altitudMax" name="altitudMax" step="1">
                        </div>

                        <div class="form-group">
                            <label for="areaTotal">📐 Área Total (km²)</label>
                            <input type="number" id="areaTotal" name="areaTotal" step="0.01">
                        </div>

                        <div class="form-group">
                            <label for="temperaturaPromedio">🌡️ Temperatura Promedio (°C)</label>
                            <input type="number" id="temperaturaPromedio" name="temperaturaPromedio" step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="precipitacionAnual">💧 Precipitación Anual (mm)</label>
                            <input type="number" id="precipitacionAnual" name="precipitacionAnual" step="1">
                        </div>

                        <div class="form-group">
                            <label for="biodiversidadIndex">🐾 Índice de Biodiversidad (0-1)</label>
                            <input type="number" id="biodiversidadIndex" name="biodiversidadIndex" step="0.001" min="0" max="1">
                        </div>

                        <div class="form-group">
                            <label for="estatusProteccion">🛡️ Estatus de Protección</label>
                            <select id="estatusProteccion" name="estatusProteccion">
                                <option value="sin_proteccion">Sin Protección</option>
                                <option value="parcial">Protección Parcial</option>
                                <option value="total">Protección Total</option>
                                <option value="reserva">Reserva</option>
                                <option value="parque_nacional">Parque Nacional</option>
                                <option value="unesco">Patrimonio UNESCO</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="calidadAgua">💧 Calidad del Agua</label>
                            <select id="calidadAgua" name="calidadAgua">
                                <option value="excelente">Excelente</option>
                                <option value="buena">Buena</option>
                                <option value="regular">Regular</option>
                                <option value="mala">Mala</option>
                                <option value="critica">Crítica</option>
                            </select>
                        </div>

                        <div class="form-full">
                            <div class="form-group">
                                <label for="descripcion">📝 Descripción</label>
                                <textarea id="descripcion" name="descripcion" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="form-full">
                            <div class="form-group">
                                <label for="amenazas">⚠️ Amenazas</label>
                                <textarea id="amenazas" name="amenazas" rows="2"></textarea>
                            </div>
                        </div>

                        <div class="form-full">
                            <div class="form-group">
                                <label for="medidasConservacion">🌱 Medidas de Conservación</label>
                                <textarea id="medidasConservacion" name="medidasConservacion" rows="2"></textarea>
                            </div>
                        </div>

                        <div class="form-full">
                            <div class="form-group">
                                <label for="imagenPortada">🖼️ URL de la Imagen de Portada</label>
                                <input type="text" id="imagenPortada" name="imagenPortada" placeholder="https://ejemplo.com/imagen.jpg">
                            </div>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn-primary">💾 Crear Hábitat</button>
                        <a href="/ecosimulator/admin/habitats" class="btn-secondary"
                           style="text-align: center; text-decoration: none; padding: var(--space-md); border-radius: var(--radius-lg);">
                            ↩️ Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>🌿 EcoSimulator v1.0 - Nuevo Hábitat</p>
    </footer>
</body>
</html>
