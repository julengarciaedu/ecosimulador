<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 EcoSimulator</title>
    <link rel="stylesheet" href="css/ecostyles.css">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a2e1f, #2d6a4f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            animation: fadeInUp 0.8s ease;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px;
            width: 90%;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 5rem;
            display: block;
            margin-bottom: 0.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #95d5b2, #52b788, #2d6a4f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .subtitle {
            opacity: 0.8;
            font-size: 1.2rem;
            margin-top: 0.5rem;
            font-weight: 300;
        }
        
        .version {
            opacity: 0.4;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        
        .spinner-container {
            margin: 30px auto;
        }
        
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #52b788;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            opacity: 0.6;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .btn-entrar {
            display: inline-block;
            padding: 14px 50px;
            background: linear-gradient(135deg, #2d6a4f, #52b788);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 25px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 5px 20px rgba(45, 106, 79, 0.3);
        }
        
        .btn-entrar:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px rgba(45, 106, 79, 0.5);
        }
        
        .btn-entrar:active {
            transform: translateY(0) scale(0.98);
        }
        
        .footer {
            margin-top: 30px;
            opacity: 0.3;
            font-size: 0.7rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .logo {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🌿</span>
        <h1>EcoSimulator</h1>
        <p class="subtitle">Simulador de Ecosistemas con Inteligencia Artificial</p>
        <p class="version">v1.0.0</p>
        
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        
        <p class="loading-text">🌱 Cargando aplicación...</p>
        
        <!-- BOTÓN DE ENTRADA - Redirige directamente al login -->
        <a href="login" class="btn-entrar">🌼 Entrar</a>
        <a href="pruebaservlet" class="btn-entrar">☠️ PS</a>
        <p class="footer">
            🌱 Conservación • Biodiversidad • Sostenibilidad
        </p>
    </div>
</body>
</html>
