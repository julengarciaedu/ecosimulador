<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 EcoSimulator - Nueva Contraseña</title>
    <link rel="stylesheet" href="/ecosimulator/css/styles.css">
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto;">
        <header>
            <h1>🔑 Establecer Nueva Contraseña</h1>
        </header>
        
        <form action="/ecosimulator/recuperar-password" method="POST" style="margin-top: var(--space-lg);">
            <input type="hidden" name="action" value="restablecer">
            <input type="hidden" name="token" value="{{token}}">
            
            {{#error}}
            <div style="background: #fee; color: #c0392b; padding: var(--space-md); border-radius: var(--radius-md); margin-bottom: var(--space-md);">
                ⚠️ {{error}}
            </div>
            {{/error}}
            
            <div class="form-group">
                <label for="nuevaPassword">🔒 Nueva Contraseña</label>
                <input type="password" id="nuevaPassword" name="nuevaPassword" 
                       placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">🔒 Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" 
                       placeholder="Repite la contraseña" required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">
                🔐 Actualizar Contraseña
            </button>
        </form>
    </div>
</body>
</html>
